[package]
name = "mudpuppy"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "Terminal UI for collaborative, turn-based code review between a user and an AI agent."
license = "AGPL-3.0-only"
repository = "https://github.com/Barmore-Genc/mudpuppy"
readme = "README.md"
keywords = ["tui", "code-review", "diff", "git", "agent"]
categories = ["command-line-utilities", "development-tools"]

# No unsafe Rust in our own source (AGENTS.md). Scopes to this package only,
# not dependencies; `forbid` can't be overridden by a local `#[allow]`.
[lints.rust]
unsafe_code = "forbid"

# The crate is split into a library (the testable core: domain schema, store,
# diff parser, session/source resolution) and a thin binary that wires the clap
# command surface to it. Keeping the core in a lib is what lets the heavily
# tested modules (`domain`, `store`) be exercised directly from `tests/`.
[lib]
name = "mudpuppy"
path = "src/lib.rs"

[[bin]]
name = "mudpuppy"
path = "src/main.rs"

# Syntax-highlight regex engine. The *default* engine is picked per target in the
# `[target.…]` tables below — onig (oniguruma, ~3.5× faster, a C dependency)
# wherever its C build cross-compiles cleanly, and the pure-Rust `fancy-regex`
# fallback on the two arm64 *cross* targets (aarch64 Linux + Windows) where it
# doesn't. These features are explicit overrides on top of that default: pass
# `--features onig` to force the C engine (e.g. to benchmark it on an
# arm64-Linux box), or `--features fancy` for the pure-Rust one. They are not in
# `default`, so a plain build follows the per-target choice;
# `tests/highlight_bench.rs` reports whichever engine is active.
[features]
default = []
fancy = ["syntect/default-fancy", "two-face/syntect-fancy"]
onig = ["syntect/default-onig", "two-face/syntect-onig"]

[dependencies]
# CLI surface. The derived command tree *is* the agent's documentation surface
# (`mudpuppy agent --help`), so it lives at the heart of the binary.
clap = { version = "4", features = ["derive"] }

# The annotation store is JSON; the schema types own (de)serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Short, URL- and filename-safe annotation IDs.
nanoid = "0.4"

# ISO-8601 timestamps for created_at / updated_at.
jiff = { version = "0.2", features = ["serde"] }

# Error handling per AGENTS.md: real error types in the library, anyhow at the
# binary/command boundary.
thiserror = "2"
anyhow = "1"

# Terminal UI for the diff viewer. crossterm types are used via ratatui's
# re-export (`ratatui::crossterm`); we depend on crossterm directly only to turn
# on its `event-stream` feature (the async `EventStream` the TUI event loop
# `select!`s on). The version is pinned to the one ratatui re-exports so the two
# stay a single, in-sync instance via Cargo's feature unification.
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Display-column widths for clamping the diff pane's horizontal scroll to its
# widest line. Pinned to the 0.2 line ratatui re-exports so the two stay a single
# instance via Cargo's feature unification.
unicode-width = "0.2"

# Annotation store (milestone 2). `directories` resolves the per-OS data dir that
# holds the store; `tempfile` + `fs4` give atomic (temp + rename) and advisory-
# locked writes so a live TUI and a headless agent never corrupt each other's
# work (PLAN.md §4).
directories = "6"
fs4 = "1"
tempfile = "3"

# Turn rendezvous (milestone 3, PLAN.md §6) and live reload (§9). `notify` is the
# coordination bus shared by both: `agent wait` blocks on store-directory changes
# instead of polling, and the TUI watches the same directory to refresh in place
# when a write lands. `tokio` drives both async loops: `agent wait`'s `select!`
# (filesystem events, the `--timeout` deadline, and a clean Ctrl-C) and the TUI's
# `select!` over crossterm's `EventStream` and the store-watch ticks. `tokio-stream`
# supplies `StreamExt::next` for the `EventStream`. Features are kept to the
# minimum the two loops need.
notify = "8"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "signal"] }
tokio-stream = "0.1"

# Syntax highlighting in the diff pane (PLAN.md §2). The regex engine (and thus
# whether we pull oniguruma's C build) is selected per target in the
# `[target.…]` tables further down, not here — both crates carry only
# `default-features = false` at the base so exactly one engine is added per
# build. See those tables and `[features]` for the onig-vs-fancy split.
syntect = { version = "5", default-features = false }

# Broad language/theme coverage for `highlight.rs`. syntect's bundled defaults
# cover only a handful of languages, so unfamiliar files rendered without
# highlighting; `two-face` ships the full Sublime/bat syntax + theme set (the
# same bundle `bat` uses). Its regex engine tracks syntect's, selected in the
# same per-target tables below.
two-face = { version = "0.5", default-features = false }

# Embedded scripting/config layer (the Lua keymap + event hooks). Luau is mlua's
# first-class, sandbox-oriented backend; `vendored` builds the interpreter from
# source so there's no system Lua dependency, keeping the toolchain-light, fully
# local build. All default keybindings live in `src/lua/core.lua`; user config is
# loaded on top. The interpreter is sandboxed: no io/os/network/subprocess.
mlua = { version = "0.10", features = ["luau", "vendored"] }

# Self-update install (update.rs). The updater downloads the prebuilt release
# archive for this build's target and swaps it in, so a user with no Rust
# toolchain can still update (we no longer shell out to `cargo install`).
# `sha2` verifies the archive against the checksum carried in the manifest before
# we trust it; `self-replace` performs the swap of the *running* executable
# correctly on both Unix and Windows (a plain rename can't replace a running .exe
# on Windows). Both are pure-Rust and cross-compile cleanly to every target. The
# archive codecs themselves are platform-split below (.tar.xz vs .zip).
sha2 = "0.10"
self-replace = "1"

# Update check (update.rs). A tiny blocking HTTP+TLS client used for the single
# launch-time GET of the release `dist-manifest.json` published to GitHub Pages —
# so the check needs no `gh` (not a hard dependency of mudpuppy). The fetch runs on
# a `tokio::task::spawn_blocking` thread so it never stalls the event loop. The TLS
# backend is split by platform (see the target tables below): rustls everywhere
# except Windows, native-tls (SChannel) on Windows. See those tables for why.

# Syntax-highlight engine, split by target (see the `[features]` note). These two
# `cfg`s partition every target, so exactly one engine is compiled per build.
#
# arm64 Linux + arm64 Windows are *cross*-built (the latter through cargo-dist's
# cargo-xwin/clang toolchain, which mishandles `/imsvc` for C/asm — the same wall
# the `ring`/native-tls note below describes). oniguruma's C build is the fragile
# piece there, so these two targets keep the pure-Rust `fancy` engine.
[target.'cfg(all(target_arch = "aarch64", any(target_os = "linux", target_os = "windows")))'.dependencies]
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Everywhere else (x86_64 Linux/Windows, both macOS arches): the faster
# oniguruma engine. These build natively (or, for x86_64 cross, with a C compiler
# that handles it), so the C dependency cross-compiles cleanly.
[target.'cfg(not(all(target_arch = "aarch64", any(target_os = "linux", target_os = "windows"))))'.dependencies]
syntect = { version = "5", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }

# Non-Windows: rustls keeps the TLS stack pure-Rust and toolchain-light.
[target.'cfg(not(windows))'.dependencies]
ureq = "2"
# macOS and Linux releases ship `.tar.xz`. `lzma-rs` is a pure-Rust xz decoder
# (no liblzma C build) and `tar` unpacks the archive — both cross-compile cleanly.
lzma-rs = "0.3"
tar = "0.4"

# Windows: rustls pulls in `ring`, whose C/asm build fails to cross-compile for
# aarch64-pc-windows-msvc under cargo-dist's cargo-xwin toolchain (`/imsvc` is
# passed to plain clang, which rejects it). native-tls maps to SChannel on
# Windows — pure-Rust bindings to the OS TLS, no C build — so it cross-compiles
# cleanly. We keep `gzip` (the only other default feature we rely on).
[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
# Windows releases ship `.zip`. `default-features = false` + `deflate` keeps the
# pure-Rust `miniz_oxide` codec and drops the optional bzip2/zstd C backends, so
# this stays consistent with the no-C-build, cross-compilable stance above.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"

# Layer 1 (unit/integration) — snapshot the ratatui `TestBackend` buffer. See
# TESTING.md: `cargo insta review` accepts/rejects, tests fail on mismatch.
insta = "1"

# Layer 2 (end-to-end) — drive the real binary through a pseudo-terminal. A PTY
# is required because the TUI enters raw mode + the alternate screen, which a
# plain piped subprocess can't provide. `vt100` interprets the escape stream
# into a settled character grid, so assertions read the *screen a user sees*
# (robust to ratatui's incremental cell-level redraws) rather than scraping raw
# bytes. vt100 0.15 rides unicode-width 0.1, side-stepping ratatui's 0.2.0 pin.
portable-pty = "0.9"
vt100 = "0.15"

# Byte-stable throwaway git repos for the e2e fixtures (never the real repo).
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
