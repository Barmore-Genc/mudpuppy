[package]
name = "mudpuppy"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
description = "Terminal UI for collaborative, turn-based code review between a human and an AI agent."
license = "AGPL-3.0-only"
repository = "https://github.com/kaangenc/mudpuppy"
readme = "README.md"
keywords = ["tui", "code-review", "diff", "git", "agent"]
categories = ["command-line-utilities", "development-tools"]

# The crate is split into a library (the testable core: domain schema, store,
# diff parser, session/source resolution) and a thin binary that wires the clap
# command surface to it. Keeping the core in a lib is what lets the heavily
# tested modules (`domain`, `store`) be exercised directly from `tests/`.
[lib]
name = "mudpuppy"
path = "src/lib.rs"

[[bin]]
name = "mudpuppy"
path = "src/main.rs"

[dependencies]
# CLI surface. The derived command tree *is* the agent's documentation surface
# (`mudpuppy agent --help`), so it lives at the heart of the binary.
clap = { version = "4", features = ["derive"] }

# The annotation store is JSON; the schema types own (de)serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Short, URL- and filename-safe annotation IDs.
nanoid = "0.4"

# ISO-8601 timestamps for created_at / updated_at.
jiff = { version = "0.2", features = ["serde"] }

# Error handling per AGENTS.md: real error types in the library, anyhow at the
# binary/command boundary.
thiserror = "2"
anyhow = "1"

# Terminal UI for the diff viewer. crossterm is used via ratatui's re-export
# (`ratatui::crossterm`) so the two can't drift out of version sync.
ratatui = "0.29"

# Annotation store (milestone 2). `directories` resolves the per-OS data dir that
# holds the store; `tempfile` + `fs4` give atomic (temp + rename) and advisory-
# locked writes so a live TUI and a headless agent never corrupt each other's
# work (PLAN.md §4).
directories = "6"
fs4 = "1"
tempfile = "3"

# NOTE: the remaining planned dependencies (tokio, notify, syntect) are
# intentionally not added yet. Each lands with the milestone that first uses it
# (see PLAN.md §2 and §10) to keep the dependency set lean and justified. Live
# reload currently polls the store's mtime; `notify` replaces that in milestone 3
# alongside the `agent wait` turn rendezvous.

[dev-dependencies]
serde_json = "1"

# Layer 1 (unit/integration) — snapshot the ratatui `TestBackend` buffer. See
# TESTING.md: `cargo insta review` accepts/rejects, tests fail on mismatch.
insta = "1"

# Layer 2 (end-to-end) — drive the real binary through a pseudo-terminal. A PTY
# is required because the TUI enters raw mode + the alternate screen, which a
# plain piped subprocess can't provide. `vt100` interprets the escape stream
# into a settled character grid, so assertions read the *screen a user sees*
# (robust to ratatui's incremental cell-level redraws) rather than scraping raw
# bytes. vt100 0.15 rides unicode-width 0.1, side-stepping ratatui's 0.2.0 pin.
portable-pty = "0.9"
vt100 = "0.15"

# Byte-stable throwaway git repos for the e2e fixtures (never the real repo).
tempfile = "3"
