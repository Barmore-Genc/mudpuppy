name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Until a Cargo project exists, the cargo-based jobs below have nothing to do.
  # This gate lets them no-op cleanly during bootstrap and switch on automatically
  # once Cargo.toml lands, so the workflow stays green either way.
  detect:
    name: Detect Cargo project
    runs-on: ubuntu-latest
    outputs:
      has_cargo: ${{ steps.check.outputs.has_cargo }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml yet — skipping cargo jobs."
          fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features --verbose
      - run: cargo test --all-features --verbose

  docs:
    name: doc
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  # Exact-match pixel oracle (TESTING.md Layer 2 / e2e/README.md): render the
  # real binary inside the pinned amd64 container and pixel-diff against the
  # committed baselines. PRs only — the review bundle + comment need PR context,
  # and this is the slow (containerized) layer. The ubuntu runner *is* native
  # amd64, so no emulation here; baselines are canonical on this arch.
  snapshots:
    name: snapshots (pixel oracle)
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Renders the real binary in the pinned amd64 container, pixel-diffs vs
      # e2e/baselines, and on mismatch publishes the review bundle to S3 +
      # comments the capability URL (reuses the org CI_S3_* / CI_APPROVE_TOKEN).
      - uses: ./.github/actions/snapshot-review
        with:
          s3-endpoint: ${{ vars.CI_S3_ENDPOINT }}
          s3-region: ${{ vars.CI_S3_REGION }}
          s3-bucket: ${{ vars.CI_S3_BUCKET }}
          s3-key-id: ${{ secrets.CI_S3_KEY_ID }}
          s3-app-key: ${{ secrets.CI_S3_APP_KEY }}
          public-base: ${{ vars.CI_S3_PUBLIC_BASE }}
          github-token: ${{ github.token }}
