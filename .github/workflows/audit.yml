name: Security audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"

permissions:
  contents: read
  # audit-check posts check annotations on PRs and opens issues for
  # advisories on push.
  checks: write
  issues: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustsec/audit-check has no prebuilt binary of its own: it shells out to
      # @actions-rs/core's findOrInstall, which compiles cargo-audit from source
      # (~5 min, uncached) unless cargo-audit is already on PATH. Drop a prebuilt
      # binary in front of it so it finds that and skips the build.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
