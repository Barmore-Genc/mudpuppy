name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Until a Cargo project exists, the cargo-based jobs below have nothing to do.
  # This gate lets them no-op cleanly during bootstrap and switch on automatically
  # once Cargo.toml lands, so the workflow stays green either way.
  detect:
    name: Detect Cargo project
    runs-on: ubuntu-latest
    outputs:
      has_cargo: ${{ steps.check.outputs.has_cargo }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml yet — skipping cargo jobs."
          fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features --verbose
      - run: cargo test --all-features --verbose

  # The release pipeline (cargo-dist) pulls GitHub Release notes from the
  # CHANGELOG.md section whose heading matches the crate version. Verify that
  # section exists *before* tagging, using the same parser cargo-dist uses, so a
  # version bump can't ship without notes.
  changelog:
    name: changelog
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@parse-changelog
      - name: Ensure CHANGELOG.md has an entry for the Cargo.toml version
        run: |
          version="$(awk -F' *= *' '/^\[package\]/{p=1} p&&/^version *=/{gsub(/"/,"",$2);print $2;exit}' Cargo.toml)"
          if ! parse-changelog CHANGELOG.md "$version" >/dev/null; then
            echo "::error file=CHANGELOG.md::No CHANGELOG.md section for version $version (expected a heading like '## $version')"
            exit 1
          fi
          echo "Found CHANGELOG.md entry for $version"

  docs:
    name: doc
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  # Source-based coverage via cargo-llvm-cov. The e2e suite drives the compiled
  # binary through a PTY, but the harness inherits our environment, so the
  # LLVM_PROFILE_FILE cargo-llvm-cov sets flows into that subprocess too — the
  # PTY tests count toward coverage. lcov is uploaded to Codecov, which posts the
  # project/diff numbers as a PR comment (see codecov.yml).
  coverage:
    name: coverage
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  # Exact-match pixel oracle (TESTING.md Layer 2 / e2e/README.md): render the
  # real binary and pixel-diff against the committed baselines. PRs only — the
  # review bundle + comment need PR context. Runs natively (no container): the
  # renders are byte-identical once the vendored font + resvg version are pinned
  # (verified macOS/arm64 == linux/amd64), so the heavy compile is cacheable via
  # rust-cache instead of being trapped in a container's volumes.
  snapshots:
    name: snapshots (pixel oracle)
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Caches the cargo registry, target dir, AND ~/.cargo/bin (cache-bin,
      # default on) — so both the mudpuppy build and the resvg install below are
      # restored on later runs. This is the speedup the container couldn't give us.
      - uses: Swatinem/rust-cache@v2
      - name: Install renderer + image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          # Pinned rasterizer. No-op (and fast) once restored from rust-cache.
          cargo install resvg --version 0.47.0 --locked
      # Renders the real binary, pixel-diffs vs e2e/baselines, and on mismatch
      # publishes the review bundle to S3 + comments the capability URL (reuses
      # the org CI_S3_* / CI_APPROVE_TOKEN).
      - uses: ./.github/actions/snapshot-review
        with:
          s3-endpoint: ${{ vars.CI_S3_ENDPOINT }}
          s3-region: ${{ vars.CI_S3_REGION }}
          s3-bucket: ${{ vars.CI_S3_BUCKET }}
          s3-key-id: ${{ secrets.CI_S3_KEY_ID }}
          s3-app-key: ${{ secrets.CI_S3_APP_KEY }}
          public-base: ${{ vars.CI_S3_PUBLIC_BASE }}
          github-token: ${{ github.token }}
