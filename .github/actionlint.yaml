# release.yml is autogenerated by `dist generate` and must not be hand-edited
# (dist overwrites it). Its embedded shell is dist's own, so silence shellcheck's
# stylistic findings (SC2086 quoting, SC2129 grouped redirects) for that file
# only — every other workflow is still fully linted.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue .+SC2086'
      - 'shellcheck reported issue .+SC2129'
