[package]
name = "mudpuppy"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
description = "Terminal UI for collaborative, turn-based code review between a human and an AI agent."
license = "AGPL-3.0-only"
repository = "https://github.com/kaangenc/mudpuppy"
readme = "README.md"
keywords = ["tui", "code-review", "diff", "git", "agent"]
categories = ["command-line-utilities", "development-tools"]

# The crate is split into a library (the testable core: domain schema, store,
# diff parser, session/source resolution) and a thin binary that wires the clap
# command surface to it. Keeping the core in a lib is what lets the heavily
# tested modules (`domain`, `store`) be exercised directly from `tests/`.
[lib]
name = "mudpuppy"
path = "src/lib.rs"

[[bin]]
name = "mudpuppy"
path = "src/main.rs"

[dependencies]
# CLI surface. The derived command tree *is* the agent's documentation surface
# (`mudpuppy agent --help`), so it lives at the heart of the binary.
clap = { version = "4", features = ["derive"] }

# The annotation store is JSON; the schema types own (de)serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Short, URL- and filename-safe annotation IDs.
nanoid = "0.4"

# ISO-8601 timestamps for created_at / updated_at.
jiff = { version = "0.2", features = ["serde"] }

# Error handling per AGENTS.md: real error types in the library, anyhow at the
# binary/command boundary.
thiserror = "2"
anyhow = "1"

# Terminal UI for the diff viewer. crossterm is used via ratatui's re-export
# (`ratatui::crossterm`) so the two can't drift out of version sync.
ratatui = "0.29"

# NOTE: the remaining planned dependencies (tokio, notify, syntect, directories,
# tempfile, fs4) are intentionally not added yet. Each lands with the milestone
# that first uses it (see PLAN.md §2 and §10) to keep the dependency set lean
# and justified.

[dev-dependencies]
serde_json = "1"
